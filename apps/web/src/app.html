<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!--
			THE SITE MARK: Lucide's heart-handshake, in static/favicon.svg.

			It is a FILE at a fixed address and not an imported asset. SvelteKit
			would hash the name and, under 4 KB, inline the whole thing into a data
			URI on every page — comment included. A favicon is fetched once and
			cached, and plenty of things that are not this browser look for it:
			readers, unfurlers, bookmark lists. They need an address that holds
			still.

			An SVG favicon may carry CSS, and the one in that file answers
			`prefers-color-scheme` — because a browser TAB is painted in the colours
			of the system, and not in the display mode this site was set to. So the
			mark is black on a light tab and white on a dark one, whichever way the
			page itself is showing.

			There is no .ico. A browser too old for an SVG favicon shows its own
			blank mark, which is a fair trade for not keeping a second copy of the
			same drawing in a format from 1990.
		-->
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<!--
			THE STORED DISPLAY MODE, SET BEFORE THE FIRST PAINT.

			The page is rendered on the server, which cannot know what this visitor
			chose. Without this, a visitor who chose dark sees a white page on every
			load, until the app starts. That flash is the ONLY reason the script is
			here and not in the app.

			It reads localStorage and sets one attribute. It knows no colours: those
			are in src/app.css, and so is the media query that answers when there is
			no attribute. The script therefore has nothing to keep in agreement with
			the stylesheet, and there is nothing to do when the visitor has made no
			choice at all.

			The script is inline because a file would be a second request in front of
			the first paint. If this site ever gets a Content Security Policy, this is
			the one script that has to be answered for.
		-->
		<script>
			try {
				const saved = localStorage.getItem('display-mode');
				if (saved === 'light' || saved === 'dark') document.documentElement.dataset.mode = saved;
			} catch {
				// A browser that refuses localStorage still gets a page, and app.css
				// still follows the setting of the machine.
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
