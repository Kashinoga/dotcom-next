packages:
  - apps/*
  - packages/*

# DO NOT INSTALL THIS PROJECT ON THE NETWORK SHARE. Develop from a local clone.
#
# The share is mounted with sshfs, and that server refuses `readlink` on any
# symlink whose target starts with '..' or '/'. pnpm's `node_modules` is built
# from such links, and so is `node_modules/.bin` in EVERY layout — so no tool can
# even be found there: `sh: svelte-kit: command not found`.
#
# `nodeLinker: hoisted` was set here for a while, because a flat tree answers the
# first half of that. It does not answer the second half, so it bought nothing
# and cost the strict check that stops a package importing what it never
# declared. The default is back.

# pnpm 10+ blocks install scripts by default. Both of these must run their own,
# or the build fails: workerd is Cloudflare's runtime, and esbuild fetches its
# platform binary.
allowBuilds:
  esbuild: true
  workerd: true
